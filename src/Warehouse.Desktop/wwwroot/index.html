    <script>
        window.printReportElement = function (selector) {
            try {
                var target = document.querySelector(selector || '.wh-printable-sheet');
                if (!target) {
                    window.print();
                    return;
                }
                var oldIframe = document.getElementById('wh-print-isolated-frame');
                if (oldIframe) {
                    oldIframe.parentNode.removeChild(oldIframe);
                }
                var iframe = document.createElement('iframe');
                iframe.id = 'wh-print-isolated-frame';
                iframe.style.position = 'fixed';
                iframe.style.right = '0';
                iframe.style.bottom = '0';
                iframe.style.width = '0';
                iframe.style.height = '0';
                iframe.style.border = '0';
                iframe.style.opacity = '0';
                document.body.appendChild(iframe);

                var doc = iframe.contentWindow.document;
                doc.open();
                doc.write('<!DOCTYPE html>' +
                    '<html dir="rtl" lang="ar">' +
                    '<head>' +
                    '<meta charset="utf-8" />' +
                    '<title>طباعة</title>' +
                    '<link href="fonts.css" rel="stylesheet" />' +
                    '<style>' +
                    '* { box-sizing: border-box; }' +
                    'html, body { margin: 0; padding: 0; background: #fff; font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif; direction: rtl; color: #0f172a; width: 100%; }' +
                    '@page { size: A4 portrait; margin: 10mm 8mm; }' +
                    '.wh-printable-sheet { width: 100% !important; max-width: 100% !important; min-height: 0 !important; height: auto !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; background: #fff !important; }' +
                    'table { width: 100%; border-collapse: collapse; page-break-inside: auto; }' +
                    'tr { page-break-inside: avoid; page-break-after: auto; }' +
                    'thead { display: table-header-group; }' +
                    'tfoot { display: table-footer-group; }' +
                    '</style>' +
                    '</head>' +
                    '<body>' +
                    target.outerHTML +
                    '</body>' +
                    '</html>');
                doc.close();

                setTimeout(function () {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                }, 300);
            } catch (e) {
                console.error('Print error:', e);
                window.print();
            }
        };
    </script>

    <script>
        function setTableItemCount(count) {
            localStorage.setItem('tableItemCount', count);
        }

        window.addEventListener('beforeunload', function (event) {
            const count = localStorage.getItem('tableItemCount') || 0;
            if (count > 0) {
                event.preventDefault();
                event.returnValue = 'You have unfinished orders. Please finish them before leaving.';
            }
        });

        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') {
                clearTableItems();
            }
        });

        function clearTableItems() {
            localStorage.removeItem('tableItemCount');
            console.log('Table items cleared');
        }

        let lastEnterTime = 0;

        window.downloadBase64File = (fileName, contentType, base64Data) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = `data:${contentType};base64,${base64Data}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.listenToDoubleEnter = function (dotNetHelper) {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();

                    const now = Date.now();
                    if (now - lastEnterTime < 500) {
                        dotNetHelper.invokeMethodAsync("ExecuteDoubleEnterFunction");
                    }
                    lastEnterTime = now;
                }
            });
        };
    </script>
